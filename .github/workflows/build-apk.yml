name: Build Renesa APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make the web app work offline
        run: |
          mkdir -p www
          cp index.html www/index.html
          curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2 -o www/supabase.js
          curl -fsSL https://cdn.tailwindcss.com/3.4.17 -o www/tailwind.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2#supabase.js#; s#https://cdn.tailwindcss.com#tailwind.js#' www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build the APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Renesa.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Renesa build ${{ github.run_number }}
          files: Renesa.apk
